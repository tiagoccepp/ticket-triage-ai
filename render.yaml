# Render Blueprint: one-click deploy (free tier OK). Paste your LLM key once
# in the Render dashboard when prompted (LLM_API_KEY); everything else
# is preconfigured. See docs/DEPLOY.md.
services:
  - type: web
    name: ticket-triage-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://opencode.ai/zen/go/v1
      - key: LLM_MODEL
        value: beam-free
      - key: OPENCODE_SESSION_ID
        value: render-prod
