# Render Blueprint: one-click deploy (free tier OK). Keys marked
# sync:false are filled once in the Render dashboard; see docs/DEPLOY.md.
services:
  - type: web
    name: ticket-triage-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: mock
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_MODEL
        value: gpt-4o-mini
